# 手動掃描（不要跟 Auto Scan 搶排程，避免重複推播）
name: Bitunix Scan

on:
  workflow_dispatch:

concurrency:
  group: bitunix-shared-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore cooldown + journal
        uses: actions/cache@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
            telegram_offset.json
          key: state-v5-${{ github.run_id }}
          restore-keys: |
            state-v5-
            state-v4-
            state-v3-
            cooldown-v2-

      - name: Ensure state files
        run: |
          if [ ! -f alert_cooldown.json ]; then
            echo '{}' > alert_cooldown.json
          fi
          if [ ! -f yes_journal.jsonl ]; then
            touch yes_journal.jsonl
          fi
          if [ ! -f session_plan_state.json ]; then
            echo '{}' > session_plan_state.json
          fi
          if [ ! -f telegram_offset.json ]; then
            echo '{"offset":0}' > telegram_offset.json
          fi

      - name: Run one scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_ACCOUNT_USDT: ${{ secrets.RISK_ACCOUNT_USDT }}
          RISK_PCT_PER_R: ${{ secrets.RISK_PCT_PER_R }}
          RISK_MAX_SAME_SIDE: ${{ secrets.RISK_MAX_SAME_SIDE }}
          RISK_MAX_TOTAL_OPEN: ${{ secrets.RISK_MAX_TOTAL_OPEN }}
          RISK_MAX_LEVERAGE: ${{ vars.RISK_MAX_LEVERAGE || '3' }}
          RISK_MAX_NOTIONAL_USDT: ${{ vars.RISK_MAX_NOTIONAL_USDT || '3000' }}
          RISK_FEE_PCT_ROUNDTRIP: ${{ vars.RISK_FEE_PCT_ROUNDTRIP || '0.12' }}
          RISK_SLIPPAGE_PCT_ROUNDTRIP: ${{ vars.RISK_SLIPPAGE_PCT_ROUNDTRIP || '0.10' }}
          PYTHONIOENCODING: utf-8
        run: python bitunix_scanner.py watch-once --n 200

      - name: Show journal stats
        if: always()
        run: |
          echo "===== journal lines ====="
          wc -l yes_journal.jsonl || true
          python bitunix_scanner.py journal stats || true
          python bitunix_scanner.py journal list --limit 40 || true

      - name: Save cooldown + journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
            telegram_offset.json
          key: state-v5-${{ github.run_id }}

      # IMPORTANT: Manual Scan must not replace cloud-journal.
      # Auto Scan is the only publisher of durable paper_state and journal snapshots.
      # Manual scans retain their own run artifacts/cache for diagnostics.
      - name: Upload manual scan journal for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-scan-journal-${{ github.run_id }}
          path: |
            yes_journal.jsonl
            alert_cooldown.json
          if-no-files-found: warn
          retention-days: 7
