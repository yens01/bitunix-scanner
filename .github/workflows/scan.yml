# 自動掃描推 Telegram（schedule + 可手動）
name: Bitunix Scan

on:
  schedule:
    # 每 15 分鐘（UTC）。避開整點 :00，較不易被 GitHub 排隊丟掉
    # 台灣時間約 :07/:22/:37/:52
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # Actions 頁可手動「Run workflow」

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cooldown cache
        uses: actions/cache@v4
        with:
          path: alert_cooldown.json
          key: alert-cooldown-${{ github.run_id }}
          restore-keys: |
            alert-cooldown-

      - name: Run one scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python bitunix_scanner.py watch-once --n 40

      - name: Keep cooldown for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alert_cooldown.json
          key: alert-cooldown-${{ github.run_id }}
