# 自動掃描（由 cron-job.org 每 15 分鐘觸發 workflow_dispatch）
name: Auto Scan

on:
  workflow_dispatch:

concurrency:
  group: bitunix-auto-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 固定前綴還原上一輪冷卻／日記；每次用新 key 寫回（cache key 不可覆寫）
      - name: Restore cooldown + journal
        uses: actions/cache@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
            telegram_offset.json
          key: state-v5-${{ github.run_id }}
          restore-keys: |
            state-v5-
            state-v4-
            state-v3-
            cooldown-v2-

      - name: Ensure state files
        run: |
          if [ ! -f alert_cooldown.json ]; then
            echo '{}' > alert_cooldown.json
          fi
          if [ ! -f yes_journal.jsonl ]; then
            touch yes_journal.jsonl
          fi
          if [ ! -f session_plan_state.json ]; then
            echo '{}' > session_plan_state.json
          fi
          if [ ! -f telegram_offset.json ]; then
            echo '{"offset":0}' > telegram_offset.json
          fi

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_ACCOUNT_USDT: ${{ secrets.RISK_ACCOUNT_USDT }}
          RISK_PCT_PER_R: ${{ secrets.RISK_PCT_PER_R }}
          RISK_MAX_SAME_SIDE: ${{ secrets.RISK_MAX_SAME_SIDE }}
          RISK_MAX_TOTAL_OPEN: ${{ secrets.RISK_MAX_TOTAL_OPEN }}
          PYTHONIOENCODING: utf-8
        # n=100：擴大山寨覆蓋；逾時已設 8 分鐘
        run: python bitunix_scanner.py watch-once --n 100

      - name: Show journal stats
        if: always()
        run: |
          echo "===== journal lines ====="
          wc -l yes_journal.jsonl || true
          python bitunix_scanner.py journal stats || true
          python bitunix_scanner.py journal list --limit 40 || true

      - name: Save cooldown + journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
            telegram_offset.json
          key: state-v5-${{ github.run_id }}

      # 同步到 cloud-journal 分支，本機／Cursor 可直接讀 raw 檔
      - name: Publish journal snapshot branch
        if: always()
        run: |
          mkdir -p /tmp/journal-pub
          cp -f yes_journal.jsonl /tmp/journal-pub/yes_journal.jsonl
          python bitunix_scanner.py journal stats > /tmp/journal-pub/journal_stats.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin cloud-journal 2>/dev/null || true
          git checkout -B cloud-journal
          mkdir -p cloud
          cp -f /tmp/journal-pub/yes_journal.jsonl cloud/yes_journal.jsonl
          cp -f /tmp/journal-pub/journal_stats.txt cloud/journal_stats.txt
          git add cloud/yes_journal.jsonl cloud/journal_stats.txt
          if git diff --staged --quiet; then
            echo "journal snapshot unchanged"
          else
            git commit -m "chore: sync cloud journal $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -f origin cloud-journal
          fi
