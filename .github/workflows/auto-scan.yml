# 自動掃描（由 cron-job.org 每 15 分鐘觸發 workflow_dispatch）
name: Auto Scan

on:
  workflow_dispatch:

concurrency:
  group: bitunix-auto-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 固定前綴還原上一輪冷卻／日記；每次用新 key 寫回（cache key 不可覆寫）
      - name: Restore cooldown + journal
        uses: actions/cache@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
          key: state-v4-${{ github.run_id }}
          restore-keys: |
            state-v4-
            state-v3-
            cooldown-v2-

      - name: Ensure state files
        run: |
          if [ ! -f alert_cooldown.json ]; then
            echo '{}' > alert_cooldown.json
          fi
          if [ ! -f yes_journal.jsonl ]; then
            touch yes_journal.jsonl
          fi
          if [ ! -f session_plan_state.json ]; then
            echo '{}' > session_plan_state.json
          fi

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_ACCOUNT_USDT: ${{ secrets.RISK_ACCOUNT_USDT }}
          RISK_PCT_PER_R: ${{ secrets.RISK_PCT_PER_R }}
          RISK_MAX_SAME_SIDE: ${{ secrets.RISK_MAX_SAME_SIDE }}
          RISK_MAX_TOTAL_OPEN: ${{ secrets.RISK_MAX_TOTAL_OPEN }}
          PYTHONIOENCODING: utf-8
        # n=30：省 Actions 分鐘數；品質過濾已夠嚴
        run: python bitunix_scanner.py watch-once --n 30

      - name: Save cooldown + journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
          key: state-v4-${{ github.run_id }}
