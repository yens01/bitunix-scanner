# 自動掃描（由 cron-job.org 每 15 分鐘觸發 workflow_dispatch）
name: Auto Scan

on:
  workflow_dispatch:

concurrency:
  group: bitunix-shared-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # 固定前綴還原上一輪冷卻／日記；每次用新 key 寫回（cache key 不可覆寫）
      - name: Restore cooldown + journal
        uses: actions/cache@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
            telegram_offset.json
          key: state-v5-${{ github.run_id }}
          restore-keys: |
            state-v5-
            state-v4-
            state-v3-
            cooldown-v2-

      - name: Ensure state files
        run: |
          if [ ! -f alert_cooldown.json ]; then
            echo '{}' > alert_cooldown.json
          fi
          if [ ! -f yes_journal.jsonl ]; then
            touch yes_journal.jsonl
          fi
          if [ ! -f session_plan_state.json ]; then
            echo '{}' > session_plan_state.json
          fi
          if [ ! -f telegram_offset.json ]; then
            echo '{"offset":0}' > telegram_offset.json
          fi

      - name: Validate Python and regression tests
        run: |
          python -m compileall -q signal_tracker.py risk_manager.py journal_analytics.py bitunix_scanner.py paper_trading.py paper_runner.py paper_auto.py paper_notify.py paper_status.py paper_performance.py paper_comparison.py
          python -m unittest discover -s tests -v

      # Durable state is sourced from the published cloud snapshot, not Actions cache.
      # Existing snapshot always overrides the initial seed in main.
      - name: Restore paper state from cloud journal
        run: |
          set -e
          git fetch --depth=1 origin cloud-journal
          if git cat-file -e FETCH_HEAD:cloud/paper_state.json 2>/dev/null; then
            git show FETCH_HEAD:cloud/paper_state.json > paper_state.json
          fi
          python -m json.tool paper_state.json >/dev/null

      - name: Paper trade simulation (no live orders)
        env:
          PAPER_TRADING_ENABLED: ${{ vars.PAPER_TRADING_ENABLED || 'true' }}
          TRADING_KILL_SWITCH: ${{ vars.TRADING_KILL_SWITCH || 'false' }}
          PAPER_MIN_QUALITY_SCORE: ${{ vars.PAPER_MIN_QUALITY_SCORE || '50' }}
        run: python paper_auto.py

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RISK_ACCOUNT_USDT: ${{ secrets.RISK_ACCOUNT_USDT }}
          RISK_PCT_PER_R: ${{ secrets.RISK_PCT_PER_R }}
          RISK_MAX_SAME_SIDE: ${{ secrets.RISK_MAX_SAME_SIDE }}
          RISK_MAX_TOTAL_OPEN: ${{ secrets.RISK_MAX_TOTAL_OPEN }}
          RISK_MAX_LEVERAGE: ${{ vars.RISK_MAX_LEVERAGE || '3' }}
          RISK_MAX_NOTIONAL_USDT: ${{ vars.RISK_MAX_NOTIONAL_USDT || '3000' }}
          RISK_FEE_PCT_ROUNDTRIP: ${{ vars.RISK_FEE_PCT_ROUNDTRIP || '0.12' }}
          RISK_SLIPPAGE_PCT_ROUNDTRIP: ${{ vars.RISK_SLIPPAGE_PCT_ROUNDTRIP || '0.10' }}
          PYTHONIOENCODING: utf-8
        # n=200：擴大山寨覆蓋；逾時 12 分鐘
        run: python bitunix_scanner.py watch-once --n 200

      - name: Show journal stats
        if: always()
        run: |
          echo "===== journal lines ====="
          wc -l yes_journal.jsonl || true
          python bitunix_scanner.py journal stats || true
          python bitunix_scanner.py journal list --limit 40 || true

      - name: Save cooldown + journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            alert_cooldown.json
            yes_journal.jsonl
            session_plan_state.json
            telegram_offset.json
          key: state-v5-${{ github.run_id }}

      - name: Telegram paper open/close notifications
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_notify.py

      # 同步到 cloud-journal 分支（獨立 orphan，避免掃描殘檔擋 checkout）
      - name: Generate analytics report
        if: always()
        run: python journal_analytics.py --output journal_analytics.json || true

      - name: Generate paper trading performance report
        if: always()
        run: python paper_performance.py --state paper_state.json --output paper_performance.json

      - name: Generate quality calibration
        if: always()
        run: python quality_calibration.py --output quality_calibration.json

      - name: Publish journal snapshot branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/journal-pub/cloud
          cp -f yes_journal.jsonl /tmp/journal-pub/cloud/yes_journal.jsonl
          python bitunix_scanner.py journal stats > /tmp/journal-pub/cloud/journal_stats.txt 2>&1 || true
          if [ -f journal_analytics.json ]; then cp journal_analytics.json /tmp/journal-pub/cloud/journal_analytics.json; fi
          cp paper_state.json /tmp/journal-pub/cloud/paper_state.json
          if [ -f quality_calibration.json ]; then cp quality_calibration.json /tmp/journal-pub/cloud/quality_calibration.json; fi
          if [ -f paper_performance.json ]; then cp paper_performance.json /tmp/journal-pub/cloud/paper_performance.json; fi
          cd /tmp/journal-pub
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cloud-journal
          git add cloud/yes_journal.jsonl cloud/journal_stats.txt cloud/paper_state.json
          if [ -f cloud/journal_analytics.json ]; then git add cloud/journal_analytics.json; fi
          if [ -f cloud/paper_performance.json ]; then git add cloud/paper_performance.json; fi
          if [ -f cloud/quality_calibration.json ]; then git add cloud/quality_calibration.json; fi
          git commit -m "chore: sync cloud journal $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Backup the previous snapshot before publishing a replacement.
          git fetch origin cloud-journal:refs/remotes/origin/cloud-journal || true
          if git rev-parse --verify refs/remotes/origin/cloud-journal >/dev/null 2>&1; then
            git push origin refs/remotes/origin/cloud-journal:refs/heads/cloud-journal-backup-${GITHUB_RUN_ID}
          fi
          git push --force-with-lease origin cloud-journal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

