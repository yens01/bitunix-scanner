# 輕量 Telegram 回覆（不掃盤）
# 搭配 cron-job.org 每 30 秒觸發 → 手機多半約 30～60 秒內可收到回覆
name: Telegram Reply

on:
  workflow_dispatch:

concurrency:
  group: bitunix-telegram-reply
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore telegram offset
        uses: actions/cache@v4
        with:
          path: telegram_offset.json
          key: tg-offset-v1-${{ github.run_id }}
          restore-keys: |
            tg-offset-v1-
            state-v5-

      - name: Ensure offset file
        run: |
          if [ ! -f telegram_offset.json ]; then
            echo '{"offset":0}' > telegram_offset.json
          fi

      # stats／規劃筆數要讀雲端日記；Reply 本身不掃盤、不改日記
      - name: Load journal from cloud-journal
        run: |
          set -e
          git fetch origin cloud-journal --depth=1
          if git show origin/cloud-journal:cloud/yes_journal.jsonl > yes_journal.jsonl 2>/dev/null; then
            echo "journal lines: $(wc -l < yes_journal.jsonl)"
          else
            echo "cloud-journal missing; empty journal"
            : > yes_journal.jsonl
          fi

      - name: Poll Telegram (~28s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python bitunix_scanner.py telegram-poll --seconds 28

      - name: Save telegram offset
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram_offset.json
          key: tg-offset-v1-${{ github.run_id }}
